name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest

      - name: Build
        run: python -m build

      - name: Install the wheel into a separate project and run its end-to-end check
        shell: bash
        run: |
          WHEEL="$PWD/$(ls dist/*.whl)"
          mkdir consumer-check
          cp examples/inventory_service/app.py examples/inventory_service/check.py consumer-check/
          cd consumer-check
          python -m venv .venv
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv/Scripts/python.exe; fi
          $PY -m pip install "$WHEEL"
          $PY -c "import api_performance_inspector as a, pathlib; d = pathlib.Path(a.__file__).parent / 'static'; assert all((d / f).is_file() for f in ('index.html', 'app.js', 'style.css'))"
          $PY check.py --require-installed
