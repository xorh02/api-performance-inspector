[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "api-performance-inspector"
version = "0.1.0"
description = "Lightweight, local-first FastAPI performance profiling with latency percentiles, slow endpoint detection and an interactive dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["fastapi", "asgi", "performance", "latency", "profiling", "metrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
api-performance-inspector = "api_performance_inspector.cli:main"

[project.urls]
Repository = "https://github.com/xorh02/api-performance-inspector"
Issues = "https://github.com/xorh02/api-performance-inspector/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/api_performance_inspector"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "benchmarks", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"benchmarks/*" = ["S"]
"examples/*" = ["S"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
